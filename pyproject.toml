[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rllab-puzzle"
version = "0.2.0"
description = "PuzzleMDP and dynamic Monte Carlo allocation for language-model reinforcement learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
tokenizer = [
  "huggingface-hub>=0.30",
  "jinja2>=3.1",
  "transformers>=4.51",
]
geometry = ["scipy>=1.10"]
puzzle = ["torch>=2.5", "transformers>=4.51", "scipy>=1.10"]
math-probe = ["sympy>=1.13,<2", "pylatexenc==2.10"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.12,<0.13",
]

[project.scripts]
rllab-data = "rllab.cli:main"
rllab-exp = "rllab.experiment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rllab._vendor.prm800k" = ["LICENSE", "SOURCE.md"]

[tool.ruff]
extend-exclude = ["src/rllab/_vendor/prm800k"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "real_rl: CPU checks requiring the pinned native verl/Torch environment",
]
